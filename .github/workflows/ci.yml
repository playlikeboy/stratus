name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build

  image:
    # Builds the image without publishing it, so that a broken Dockerfile shows in the pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: stratus:ci
      - name: The image starts and answers
        run: |
          docker run -d --name stratus -p 4566:4566 stratus:ci
          for _ in $(seq 1 50); do curl -sf localhost:4566/_stratus/ready && exit 0; sleep 0.2; done
          docker logs stratus; exit 1
